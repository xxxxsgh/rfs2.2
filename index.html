<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>AETHER — Exploração Espacial Procedural</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03040a">
<meta name="description" content="AETHER — universo procedural determinístico: voe da órbita ao solo sem carregamento.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2303040a'/%3E%3Ccircle cx='32' cy='36' r='20' fill='%23ff8a3d'/%3E%3Cellipse cx='32' cy='36' rx='30' ry='7' fill='none' stroke='%2374e0ff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/ui/style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="glwrap"></div>

  <!-- HUD raiz: preenchido pelos módulos de UI -->
  <div id="hud" class="hud"></div>

  <!-- Tela de boot -->
  <div id="boot">
    <div class="boot-inner">
      <h1>AETHER</h1>
      <p class="boot-sub">universo procedural determinístico</p>
      <div id="bootBar"><div id="bootFill"></div></div>
      <p id="bootTxt">inicializando núcleo…</p>
      <button id="bootBtn" hidden>INICIAR</button>
      <p class="boot-seed">seed <span id="bootSeed">—</span></p>
    </div>
  </div>

  <noscript><p style="color:#fff;padding:2rem">Este jogo requer JavaScript e WebGL2.</p></noscript>
</div>

<script type="module">
  import { boot } from './src/main.js';
  boot().catch((err) => {
    console.error(err);
    const t = document.getElementById('bootTxt');
    if (t) { t.textContent = 'falha ao iniciar: ' + (err && err.message ? err.message : err); t.style.color = '#ff6b6b'; }
  });
</script>
</body>
</html>
