var UI = {};
function $(id){ return document.getElementById(id); }

function fmtTime(s){
  if(!s && s !== 0) return "--:--.--";
  var m = Math.floor(s/60);
  var sec = Math.floor(s%60);
  var cs = Math.floor((s*100)%100);
  return (m<10?"0":"")+m+":"+(sec<10?"0":"")+sec+"."+(cs<10?"0":"")+cs;
}

function toast(msg, kind){
  var el = document.createElement("div");
  el.className = "toast" + (kind ? " "+kind : "");
  el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(function(){
    el.style.transition = "opacity 0.4s";
    el.style.opacity = "0";
    setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 420);
  }, 2600);
  while($("toasts").children.length > 4) $("toasts").removeChild($("toasts").firstChild);
}

var centerTimer = 0;
function showCenter(main, sub, dur){
  $("centerMsg").textContent = main;
  $("centerMsg").style.opacity = "1";
  $("subMsg").textContent = sub || "";
  $("subMsg").style.opacity = sub ? "1" : "0";
  centerTimer = dur || 1.5;
}

var promptTimer = 0, promptAction = null;
function promptText(txt, action){
  var p = $("prompt");
  p.textContent = txt;
  p.classList.remove("hidden");
  p.style.pointerEvents = action ? "auto" : "none";
  promptAction = action || null;
  promptTimer = 0.25;
}

function flashDamage(){
  var d = $("dmgFlash");
  d.style.opacity = "1";
  setTimeout(function(){ d.style.opacity = "0"; }, 130);
}
function flashCheckpoint(){
  var f = $("flash");
  f.style.transition = "opacity 0.05s";
  f.style.opacity = "0.28";
  setTimeout(function(){ f.style.transition = "opacity 0.3s"; f.style.opacity = "0"; }, 60);
}

function updateHudCounters(){
  $("hCredits").textContent = save.credits;
  $("hRank").textContent = save.rank;
  $("hFe").textContent = save.resources.ferrite;
  $("hPl").textContent = save.resources.plasma;
  $("hNg").textContent = save.resources.core;
  $("hCap").textContent = "/" + (ship ? ship.stats.cargo : 60);
}

function updateHud(dt){
  if(!ship) return;
  var st = ship.stats;
  $("hSpeed").textContent = Math.round(ship.speed);
  var alt = ship.group.position.y - terrainHeight(ship.group.position.x, ship.group.position.z);
  $("hAlt").textContent = Math.round(alt);
  $("boostFill").style.width = (ship.boostE/st.boostMax*100).toFixed(1)+"%";
  $("shieldFill").style.width = (clamp(ship.shield/st.shieldMax,0,1)*100).toFixed(1)+"%";
  $("speedLines").style.opacity = ship.boosting ? "0.75" : (ship.speed > st.maxSpeed*0.85 ? "0.35" : "0");

  if(centerTimer > 0){
    centerTimer -= dt;
    if(centerTimer <= 0){ $("centerMsg").style.opacity="0"; $("subMsg").style.opacity="0"; }
  }
  if(promptTimer > 0){
    promptTimer -= dt;
    if(promptTimer <= 0){ $("prompt").classList.add("hidden"); promptAction = null; }
  }

  if(race.state === "running" || race.state === "countdown"){
    $("raceTime").textContent = race.state === "countdown" ? "PRONTO" : fmtTime(race.t);
    var tr = race.track;
    var info = tr.name + "  |  CP " + ((race.ringIdx % tr.pts.length)+1) + "/" + tr.pts.length;
    if(tr.laps > 1) info += "  |  V " + (race.lap+1) + "/" + tr.laps;
    info += "  |  POS " + race.place + "/" + (race.rivals.length+1);
    if(race.bestLap) info += "  |  MELHOR " + fmtTime(race.bestLap);
    $("raceInfo").textContent = info;
  } else if(contract.active){
    $("raceHud").classList.remove("hidden");
    $("raceTime").textContent = fmtTime(Math.max(0,contract.timeLeft));
    $("raceInfo").textContent = contract.name + "  |  " + contract.cargo;
  } else {
    $("raceHud").classList.add("hidden");
  }
  drawRadar();
  drawCompass();
}

/* ---------- radar circular ---------- */
var radarCtx = null;
function drawRadar(){
  if(!radarCtx) radarCtx = $("radar").getContext("2d");
  var c = radarCtx, W = 264, R = W/2;
  c.clearRect(0,0,W,W);
  c.strokeStyle = "rgba(0,240,255,0.25)";
  c.lineWidth = 2;
  c.beginPath(); c.arc(R,R,R-4,0,6.283); c.stroke();
  c.beginPath(); c.arc(R,R,(R-4)*0.55,0,6.283); c.stroke();
  c.beginPath(); c.moveTo(R,4); c.lineTo(R,W-4); c.moveTo(4,R); c.lineTo(W-4,R); c.stroke();

  var range = 900;
  _fwd.set(0,0,-1).applyQuaternion(ship.group.quaternion);
  var heading = Math.atan2(_fwd.x, -_fwd.z);
  var p = ship.group.position;

  function plot(wx, wz, color, size){
    var dx = wx - p.x, dz = wz - p.z;
    var d = Math.sqrt(dx*dx+dz*dz);
    var a = Math.atan2(dx, -dz) - heading;
    var rr = Math.min(d/range, 1)*(R-10);
    var x = R + Math.sin(a)*rr, y = R - Math.cos(a)*rr;
    c.fillStyle = color;
    c.beginPath(); c.arc(x,y,size||4,0,6.283); c.fill();
  }
  var i;
  for(i=0;i<world.resources.length;i++){
    var n = world.resources[i];
    plot(n.pos.x, n.pos.z, n.scanned ? "#ffd24d" : "rgba(255,210,77,0.35)", 3);
  }
  for(i=0;i<bases.length;i++) plot(bases[i].pos.x, bases[i].pos.z, "#00f0ff", 5);
  for(i=0;i<tracks.length;i++) plot(tracks[i].start.x, tracks[i].start.z, trackLocked(tracks[i]) ? "#7a5a5a" : "#5cff9d", 5);
  for(i=0;i<world.structures.length;i++) plot(world.structures[i].pos.x, world.structures[i].pos.z, "#b46bff", 3);
  if(race.state === "running"){
    var tgt = race.track.pts[race.ringIdx % race.track.pts.length];
    plot(tgt.x, tgt.z, "#ffffff", 6);
    for(i=0;i<race.rivals.length;i++) plot(race.rivals[i].mesh.position.x, race.rivals[i].mesh.position.z, "#ff5a3c", 4);
  }
  // nave
  c.fillStyle = "#ffffff";
  c.beginPath(); c.moveTo(R,R-9); c.lineTo(R-6,R+7); c.lineTo(R+6,R+7); c.closePath(); c.fill();
}

/* ---------- bussola ---------- */
var compCtx = null;
function drawCompass(){
  if(!compCtx) compCtx = $("compassCv").getContext("2d");
  var c = compCtx, W = 920, H = 68;
  c.clearRect(0,0,W,H);
  _fwd.set(0,0,-1).applyQuaternion(ship.group.quaternion);
  var heading = Math.atan2(_fwd.x, -_fwd.z);
  var deg = heading*180/Math.PI;
  var span = 150; // graus visiveis
  var pxPerDeg = W/span;

  c.font = "18px 'Trebuchet MS',sans-serif";
  c.textAlign = "center";
  var dirs = [[0,"N"],[45,"NE"],[90,"L"],[135,"SE"],[180,"S"],[225,"SO"],[270,"O"],[315,"NO"]];
  for(var i=0;i<dirs.length;i++){
    var delta = ((dirs[i][0] - deg + 540) % 360) - 180;
    if(Math.abs(delta) > span/2) continue;
    var x = W/2 + delta*pxPerDeg;
    c.fillStyle = "rgba(0,240,255,0.85)";
    c.fillRect(x-1, 8, 2, 12);
    c.fillStyle = "#dff6ff";
    c.fillText(dirs[i][1], x, 40);
  }
  // marcadores de POI
  var p = ship.group.position;
  var marks = [];
  var j;
  for(j=0;j<bases.length;j++) marks.push({ pos:bases[j].pos, col:"#00f0ff", txt:bases[j].name.split(" ")[1]||"BASE" });
  for(j=0;j<tracks.length;j++) marks.push({ pos:tracks[j].start, col: trackLocked(tracks[j])?"#886":"#5cff9d", txt:"PISTA" });
  if(contract.active) marks.push({ pos:bases[contract.to].pos, col:"#ffd24d", txt:"CARGA" });
  if(race.state === "running") marks.push({ pos:race.track.pts[race.ringIdx % race.track.pts.length], col:"#ffffff", txt:"CP" });

  c.font = "15px 'Trebuchet MS',sans-serif";
  // ordena por distancia e evita rotulos sobrepostos
  var visible = [];
  for(j=0;j<marks.length;j++){
    var m = marks[j];
    var d = Math.sqrt((m.pos.x-p.x)*(m.pos.x-p.x)+(m.pos.z-p.z)*(m.pos.z-p.z));
    if(d > 3500) continue;
    var bearing = Math.atan2(m.pos.x-p.x, -(m.pos.z-p.z))*180/Math.PI;
    var dd = ((bearing - deg + 540) % 360) - 180;
    if(Math.abs(dd) > span/2) continue;
    visible.push({ x:W/2 + dd*pxPerDeg, d:d, col:m.col });
  }
  visible.sort(function(a,b){ return a.d-b.d; });
  var used = [];
  for(j=0;j<visible.length;j++){
    var v = visible[j];
    c.fillStyle = v.col;
    c.beginPath(); c.moveTo(v.x,52); c.lineTo(v.x-6,64); c.lineTo(v.x+6,64); c.closePath(); c.fill();
    var clash = false;
    for(var u=0;u<used.length;u++) if(Math.abs(used[u]-v.x) < 78) clash = true;
    if(clash) continue;
    used.push(v.x);
    c.fillText(Math.round(v.d)+"m", v.x, 46);
  }
  c.fillStyle = "#ffffff";
  c.fillRect(W/2-1, 4, 2, 20);
}

var arrow3d = null;

function updateArrow(){
  var target = null;
  if(race.state === "running") target = race.track.pts[race.ringIdx % race.track.pts.length];
  else if(contract.active) target = bases[contract.to].pos;
  if(!target){ arrow3d.visible = false; return; }
  arrow3d.visible = true;
  _fwd.set(0,0,-1).applyQuaternion(ship.group.quaternion);
  _up.set(0,1,0).applyQuaternion(ship.group.quaternion);
  arrow3d.position.copy(ship.group.position).addScaledVector(_fwd, 13).addScaledVector(_up, 3.4);
  arrow3d.lookAt(target);
  arrow3d.rotateX(Math.PI/2);
  var pulse = 1 + Math.sin(performance.now()*0.008)*0.15;
  arrow3d.scale.setScalar(pulse);
}

var input = { pitch:0, yaw:0, roll:0, throttle:0.35, lift:0, boost:false, drift:false, mine:false, touch:false };
var keys = {};
var touchMode = false;

function initInput(){
  window.addEventListener("keydown", function(e){
    if(e.repeat) return;
    audioResume();
    var k = e.key.toLowerCase();
    keys[k] = true;
    if(k === "r"){ if(!paused) doScan(); }
    if(k === "escape"){ if(openPanel) closePanels(); else openPause(); }
    if(k === "c"){ if(openPanel) closePanels(); else openCatalog(); }
    if(k === "p"){ togglePhoto(); }
    if(k === "x"){ if(promptAction) { var a = promptAction; promptAction = null; a(); } }
    if(k === "m"){ setMuted(!save.muted); }
    if([" ","arrowup","arrowdown","arrowleft","arrowright"].indexOf(k) >= 0) e.preventDefault();
  });
  window.addEventListener("keyup", function(e){ keys[e.key.toLowerCase()] = false; });
  window.addEventListener("blur", function(){ keys = {}; });

  $("prompt").addEventListener("click", function(){
    if(promptAction){ var a = promptAction; promptAction = null; a(); }
  });

  $("btnMute").onclick = function(){ audioResume(); setMuted(!save.muted); };
  $("btnCat").onclick = function(){ audioResume(); SFX.ui(); if(openPanel) closePanels(); else openCatalog(); };
  $("btnPause").onclick = function(){ audioResume(); SFX.ui(); if(openPanel) closePanels(); else openPause(); };
  $("btnPhoto").onclick = function(){ audioResume(); SFX.ui(); togglePhoto(); };

  // deteccao de toque
  window.addEventListener("touchstart", function(){
    if(!touchMode){
      touchMode = true;
      input.touch = true;
      $("touch").style.display = "block";
      document.body.classList.add("touchOn");
      input.throttle = 0.75;
    }
    audioResume();
  }, { passive:true });

  initTouchControls();
  window.addEventListener("resize", onResize);
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

function initTouchControls(){
  var base = $("stickBase"), nub = $("stickNub");
  var stickId = null, cx = 0, cy = 0, R = 55;
  function setNub(dx,dy){
    nub.style.left = (45+dx)+"px";
    nub.style.top = (45+dy)+"px";
  }
  base.addEventListener("touchstart", function(e){
    e.preventDefault();
    var t = e.changedTouches[0];
    stickId = t.identifier;
    var r = base.getBoundingClientRect();
    cx = r.left + r.width/2; cy = r.top + r.height/2;
  }, { passive:false });
  base.addEventListener("touchmove", function(e){
    e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var t = e.changedTouches[i];
      if(t.identifier !== stickId) continue;
      var dx = t.clientX - cx, dy = t.clientY - cy;
      var d = Math.sqrt(dx*dx+dy*dy);
      if(d > R){ dx = dx/d*R; dy = dy/d*R; }
      setNub(dx,dy);
      input.yaw = clamp(dx/R, -1, 1);
      input.pitch = clamp(-dy/R, -1, 1);
    }
  }, { passive:false });
  function endStick(e){
    for(var i=0;i<e.changedTouches.length;i++){
      if(e.changedTouches[i].identifier === stickId){
        stickId = null; input.yaw = 0; input.pitch = 0; setNub(0,0);
      }
    }
  }
  base.addEventListener("touchend", endStick, { passive:true });
  base.addEventListener("touchcancel", endStick, { passive:true });

  function bindBtn(id, onDown, onUp, hold){
    var el = $(id);
    el.addEventListener("touchstart", function(e){
      e.preventDefault(); el.classList.add("on"); audioResume(); onDown();
    }, { passive:false });
    var up = function(e){ el.classList.remove("on"); if(onUp) onUp(); };
    el.addEventListener("touchend", up, { passive:true });
    el.addEventListener("touchcancel", up, { passive:true });
  }
  bindBtn("tbBoost", function(){ input.boost = true; }, function(){ input.boost = false; });
  bindBtn("tbDrift", function(){ input.drift = true; }, function(){ input.drift = false; });
  bindBtn("tbScan",  function(){ doScan(); }, null);
  bindBtn("tbUp",    function(){ input.lift = 1; }, function(){ input.lift = 0; });
  bindBtn("tbDown",  function(){ input.lift = -1; }, function(){ input.lift = 0; });
  bindBtn("tbMine",  function(){ input.mine = true; }, function(){ input.mine = false; });
}

function updateInput(dt){
  if(paused){ input.boost = false; return; }
  if(!touchMode){
    var p = 0, y = 0, r = 0, l = 0;
    if(keys["arrowup"]) p += 1;
    if(keys["arrowdown"]) p -= 1;
    if(keys["a"] || keys["arrowleft"]) y -= 1;
    if(keys["d"] || keys["arrowright"]) y += 1;
    if(keys["q"]) r -= 1;
    if(keys["e"]) r += 1;
    if(keys[" "]) l += 1;
    if(keys["control"] || keys["z"]) l -= 1;
    input.pitch = damp(input.pitch, p, 12, dt);
    input.yaw   = damp(input.yaw,   y, 12, dt);
    input.roll  = damp(input.roll,  r, 12, dt);
    input.lift  = damp(input.lift,  l, 10, dt);
    if(keys["w"]) input.throttle = clamp(input.throttle + dt*0.9, 0, 1);
    if(keys["s"]) input.throttle = clamp(input.throttle - dt*1.2, 0, 1);
    input.boost = !!keys["shift"];
    input.drift = !!keys["f"];
    input.mine  = !!keys["g"];
  } else {
    input.roll = damp(input.roll, 0, 8, dt);
    input.throttle = clamp(input.throttle + (input.boost ? dt*0.6 : 0), 0.7, 1);
  }
  ship.drifting = input.drift;
}

/* =====================================================================
   12. MODO FOTO
   ===================================================================== */
var photo = { active:false, filter:"none", yaw:0, pitch:0.2, dist:26, dragging:false, lx:0, ly:0 };
var FILTERS = [
  { id:"none",   name:"Puro",     css:"none" },
  { id:"neon",   name:"Neon",     css:"saturate(1.8) contrast(1.15) hue-rotate(-12deg)" },
  { id:"noir",   name:"Noir",     css:"grayscale(1) contrast(1.35)" },
  { id:"vintage",name:"Antigo",   css:"sepia(0.65) contrast(1.1) saturate(1.2)" },
  { id:"cold",   name:"Gelido",   css:"hue-rotate(35deg) saturate(1.3) brightness(1.05)" },
  { id:"dream",  name:"Onirico",  css:"blur(0.6px) saturate(1.6) brightness(1.1)" }
];

function togglePhoto(){
  photo.active = !photo.active;
  if(photo.active){
    $("hud").classList.add("hidden");
    $("touch").style.display = "none";
    buildPhotoBar();
    photo.yaw = 0; photo.pitch = 0.2; photo.dist = 26;
  } else {
    $("hud").classList.remove("hidden");
    if(touchMode) $("touch").style.display = "block";
    var b = $("photoBar"); if(b && b.parentNode) b.parentNode.removeChild(b);
    $("glwrap").style.filter = "none";
  }
}

function buildPhotoBar(){
  var old = $("photoBar"); if(old && old.parentNode) old.parentNode.removeChild(old);
  var d = document.createElement("div");
  d.id = "photoBar";
  var h = '<span class="small" style="width:100%;text-align:center">MODO FOTO - arraste para girar, pinca ou roda para zoom</span>';
  for(var i=0;i<FILTERS.length;i++) h += '<span class="btn" data-f="'+i+'">'+FILTERS[i].name+'</span>';
  h += '<span class="btn alt" id="btnShot">CAPTURAR</span><span class="btn" id="btnPhotoExit">SAIR</span>';
  d.innerHTML = h;
  $("app").appendChild(d);
  var fs = d.querySelectorAll("[data-f]");
  for(var j=0;j<fs.length;j++){
    fs[j].onclick = (function(idx){ return function(){
      photo.filter = FILTERS[idx].css;
      $("glwrap").style.filter = FILTERS[idx].css;
      SFX.ui();
    }; })(parseInt(fs[j].getAttribute("data-f"),10));
  }
  d.querySelector("#btnShot").onclick = capturePhoto;
  d.querySelector("#btnPhotoExit").onclick = function(){ SFX.ui(); togglePhoto(); };
}

function capturePhoto(){
  SFX.checkpoint();
  var f = $("flash"); f.style.opacity = "0.9";
  setTimeout(function(){ f.style.opacity = "0"; }, 120);
  try{
    renderer.render(scene, camera);
    var url = renderer.domElement.toDataURL("image/png");
    var a = document.createElement("a");
    a.href = url;
    a.download = "kyrion7_" + Math.floor(performance.now()) + ".png";
    a.click();
    toast("Foto registrada no diario", "good");
  }catch(e){ toast("Nao foi possivel salvar a imagem", "bad"); }
}

function initPhotoDrag(){
  var el = renderer.domElement;
  function down(x,y){ photo.dragging = true; photo.lx = x; photo.ly = y; }
  function move(x,y){
    if(!photo.dragging || !photo.active) return;
    photo.yaw -= (x-photo.lx)*0.006;
    photo.pitch = clamp(photo.pitch + (y-photo.ly)*0.005, -1.2, 1.2);
    photo.lx = x; photo.ly = y;
  }
  function up(){ photo.dragging = false; }
  el.addEventListener("mousedown", function(e){ if(photo.active) down(e.clientX,e.clientY); });
  window.addEventListener("mousemove", function(e){ move(e.clientX,e.clientY); });
  window.addEventListener("mouseup", up);
  el.addEventListener("touchstart", function(e){ if(photo.active && e.touches.length===1) down(e.touches[0].clientX,e.touches[0].clientY); }, { passive:true });
  el.addEventListener("touchmove", function(e){
    if(!photo.active) return;
    if(e.touches.length===1) move(e.touches[0].clientX,e.touches[0].clientY);
    else if(e.touches.length===2){
      var dx = e.touches[0].clientX-e.touches[1].clientX;
      var dy = e.touches[0].clientY-e.touches[1].clientY;
      var d = Math.sqrt(dx*dx+dy*dy);
      if(photo._pd) photo.dist = clamp(photo.dist - (d-photo._pd)*0.15, 8, 90);
      photo._pd = d;
    }
  }, { passive:true });
  el.addEventListener("touchend", function(){ up(); photo._pd = 0; }, { passive:true });
  window.addEventListener("wheel", function(e){ if(photo.active) photo.dist = clamp(photo.dist + e.deltaY*0.02, 8, 90); }, { passive:true });
}

function updatePhotoCamera(dt){
  var sp = ship.group.position;
  var x = sp.x + Math.sin(photo.yaw)*Math.cos(photo.pitch)*photo.dist;
  var y = sp.y + Math.sin(photo.pitch)*photo.dist + 4;
  var z = sp.z + Math.cos(photo.yaw)*Math.cos(photo.pitch)*photo.dist;
  var gy = terrainHeight(x,z)+3;
  if(y < gy) y = gy;
  camera.position.set(x,y,z);
  camera.lookAt(sp.x, sp.y+1.5, sp.z);
  if(Math.abs(camera.fov-58) > 0.1){ camera.fov = 58; camera.updateProjectionMatrix(); }
}
/* =====================================================================
   13. INTERACOES DE MUNDO, LOOP PRINCIPAL E INICIALIZACAO
   ===================================================================== */
var paused = false, running = false, lastT = 0;

function checkInteractions(){
  if(paused || photo.active || !ship || ship.dead) return;
  var p = ship.group.position;
  var i;
  // base mais proxima
  for(i=0;i<bases.length;i++){
    var b = bases[i];
    if(p.distanceTo(b.pos) < 80){
      save.lastBase = b.id;
      if(race.state === "idle"){
        promptText("X ou toque aqui: acoplar em " + b.name, (function(id){ return function(){ SFX.ui(); openShop(id); }; })(b.id));
      }
      return;
    }
  }
  if(race.state !== "idle") return;
  // largada de pista: atravessar o anel inicial comeca a corrida
  for(i=0;i<tracks.length;i++){
    var tr = tracks[i];
    var d = p.distanceTo(tr.start);
    if(d < 110){
      var lock = trackLocked(tr);
      if(lock){ promptText(tr.name + " trancada - exige " + lock); return; }
      if(d < 18 && race.startCd <= 0){ startRace(tr); return; }
      promptText("Atravesse o anel branco ou toque aqui para largar em " + tr.name,
        (function(t){ return function(){ SFX.ui(); startRace(t); }; })(tr));
      return;
    }
  }
}

/* LOD simples: vegetacao e depositos somem alem do alcance da nevoa,
   o que corta chamadas de desenho sem alterar a silhueta do terreno */
var _lodTimer = 0;
function updateLOD(dt){
  _lodTimer -= dt;
  if(_lodTimer > 0) return;
  _lodTimer = 0.25;
  var cx = camera.position.x, cz = camera.position.z;
  var limit = FOG_FAR*0.95, limit2 = limit*limit;
  for(var k in world.chunks){
    var e = world.chunks[k];
    var dx = e.cx*CHUNK - cx, dz = e.cz*CHUNK - cz;
    var d2 = dx*dx + dz*dz;
    if(e.props) e.props.visible = d2 < (limit+CHUNK)*(limit+CHUNK);
    for(var r=0;r<e.res.length;r++) e.res[r].mesh.visible = d2 < limit2;
  }
}

function updateBaseVisual(dt){
  for(var i=0;i<bases.length;i++){
    bases[i].ring.rotation.z += dt*0.6;
    var d = bases[i].pos.distanceTo(camera.position);
    bases[i].group.visible = d < FOG_FAR*1.6;
  }
  for(var t=0;t<tracks.length;t++){
    var tr = tracks[t];
    var dd = tr.start.distanceTo(camera.position);
    tr.group.visible = (race.track === tr) || dd < FOG_FAR*1.5;
  }
}

function animate(now){
  requestAnimationFrame(animate);
  if(!running) return;
  var dt = Math.min(0.05, (now - lastT)/1000 || 0.016);
  lastT = now;
  save.playtime += dt;

  if(!paused && !photo.active){
    updateInput(dt);
    updateShip(dt);
    updateRace(dt);
    updateContract(dt);
    updateMining(dt);
    updateScanner(dt);
    checkInteractions();
  }
  updateResourceSpin(dt);
  updateFauna(dt, ship.group.position);
  updateCamera(dt);
  updateSky(dt);
  updateArrow();
  updateBaseVisual(dt);
  updateLOD(dt);
  updateChunks(ship.group.position.x, ship.group.position.z, false);
  respawnFaunaMaybe(dt);
  if(!photo.active) updateHud(dt);
  musicTick(dt);
  engineAudio(clamp(ship.speed/ship.stats.maxSpeed,0,1.4), ship.boosting);

  saveTimer -= dt;
  if(saveTimer <= 0){ saveTimer = 12; writeSave(); }

  renderer.render(scene, camera);
}

var faunaTimer = 0;
function respawnFaunaMaybe(dt){
  faunaTimer -= dt;
  if(faunaTimer <= 0){
    faunaTimer = 5;
    respawnFauna(ship.group.position, false);
  }
}

/* ---------- manifest PWA embutido ---------- */
function injectManifest(){
  var manifest = {
    name: "KYRION-7",
    short_name: "KYRION-7",
    description: "Arcade de exploracao e corridas de naves em um planeta alienigena.",
    start_url: ".",
    display: "fullscreen",
    orientation: "landscape",
    background_color: "#05060f",
    theme_color: "#05060f",
    icons: [{
      src: "data:image/svg+xml;base64," + btoa("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' fill='#05060f'/><polygon points='256,64 416,416 256,336 96,416' fill='#00f0ff'/></svg>"),
      sizes: "512x512",
      type: "image/svg+xml",
      purpose: "any"
    }]
  };
  var blob = new Blob([JSON.stringify(manifest)], { type:"application/json" });

  link.rel = "manifest";
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
}

/* ---------- carregamento progressivo ---------- */
function setProgress(pct, txt){
  $("loadFill").style.width = clamp(pct,0,100)+"%";
  if(txt) $("loadTxt").textContent = txt;
}

function bootstrap(){
  injectManifest();
  loadSave();
  if(!window.THREE){
    $("loadTxt").textContent = "falha ao carregar a biblioteca 3D - verifique a conexao";
    return;
  }
  var steps = [
    ["ligando reatores graficos", function(){ initRenderer(); }],
    ["semeando flora e cristais", function(){ initPropAssets(); initResourceAssets(); }],
    ["mapeando bases orbitais", function(){ initBases(); }],
    ["tracando circuitos de corrida", function(){ initTracks(); }],
    ["despertando a fauna local", function(){ initFauna(); initTrail(); initArrow(); }],
    ["montando a nave", function(){ createShip(); updateHudCounters(); }],
    ["gerando terreno inicial", function(){ generateInitialChunks(); }],
    ["calibrando controles", function(){ initInput(); initPhotoDrag(); onResize(); }]
  ];
  var i = 0;
  function step(){
    if(i >= steps.length){ finishLoading(); return; }
    setProgress(i/steps.length*92, steps[i][0]+"...");
    var fn = steps[i][1];
    i++;
    requestAnimationFrame(function(){
      try{ fn(); }catch(err){
        $("loadTxt").textContent = "erro na inicializacao: " + err.message;
        throw err;
      }
      setTimeout(step, 16);
    });
  }
  step();
}

function generateInitialChunks(){
  var p = ship.group.position;
  updateChunks(p.x, p.z, true);
  // ajusta altura inicial acima do solo
  var gh = terrainHeight(p.x,p.z);
  if(p.y < gh+30) p.y = gh+45;
}

function finishLoading(){
  setProgress(100, "pronto");
  var b = $("startBtn");
  b.style.display = "block";
  b.textContent = save.playtime > 30 ? "CONTINUAR EXPLORACAO" : "ENTRAR NA ATMOSFERA";
  var go = function(){
    audioInit();
    audioResume();
    setMuted(!!save.muted);
    $("loading").style.display = "none";
    $("hud").classList.remove("hidden");
    running = true;
    lastT = performance.now();
    requestAnimationFrame(animate);
    showCenter("KYRION-7", "bem vindo, piloto", 3);
    setTimeout(function(){ toast("Use R para escanear e G para minerar. Procure aneis brilhantes para correr."); }, 1200);
    if(Object.keys(save.catalog).length === 0){
      setTimeout(function(){ toast("Base Aurora fica logo atras de voce - acople para melhorar a nave."); }, 4200);
    }
  };
  b.onclick = go;
  b.addEventListener("touchstart", function(e){ e.preventDefault(); go(); }, { passive:false });
  window.addEventListener("keydown", function once(e){
    if(!running && (e.key === "Enter" || e.key === " ")){ go(); }
  });
}

window.addEventListener("beforeunload", function(){ writeSave(); });
document.addEventListener("visibilitychange", function(){ if(document.hidden){ writeSave(); } });

if(document.readyState === "complete" || document.readyState === "interactive") bootstrap();
else window.addEventListener("DOMContentLoaded", bootstrap);
</script>
