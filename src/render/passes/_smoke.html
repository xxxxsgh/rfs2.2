<!doctype html><meta charset=utf-8>
<script type="importmap">{"imports":{"three":"../../../vendor/three/build/three.module.js"}}</script>
<body style="margin:0;overflow:hidden"><div id="glwrap"></div>
<script type="module">
import * as THREE from 'three';
import { createContext } from '../../core/context.js';
import * as postfx from '../postfx.js';

const errors = [];
window.addEventListener('error', (e) => errors.push('window: ' + e.message));
const origError = console.error;
console.error = (...a) => { errors.push('console: ' + a.map(String).join(' ').slice(0, 400)); origError(...a); };

const ctx = createContext({ container: document.getElementById('glwrap'), seed: 'SMOKE', quality: 'high' });

// Conteúdo mínimo para o depth buffer ter geometria de verdade.
const mesh = new THREE.Mesh(
  new THREE.IcosahedronGeometry(2, 3),
  new THREE.MeshStandardMaterial({ color: 0xff8a3d, roughness: 0.4, metalness: 0.1, emissive: 0x221100 }));
ctx.engine.scene.add(mesh);
const light = new THREE.DirectionalLight(0xffffff, 6); light.position.set(3, 4, 5);
ctx.engine.scene.add(light, new THREE.AmbientLight(0x335588, 1.2));
const bright = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 12),
  new THREE.MeshBasicMaterial({ color: 0xffffff }));
bright.position.set(1.6, 1.6, 1.6); bright.material.color.setRGB(9, 8, 6);
ctx.engine.scene.add(bright);
ctx.engine.camera.position.set(0, 0, 8);

// Sol falso para exercitar os godrays.
ctx.sky = { sunDirection: new THREE.Vector3(0.18, 0.22, -0.96).normalize(), sunColor: new THREE.Color(1, 0.9, 0.75), sunIntensity: 3 };

// Chão + caixas encostadas: dá contato para a SSAO ocluir.
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40),
  new THREE.MeshStandardMaterial({ color: 0x88aa66, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -2.2;
ctx.engine.scene.add(floor);
for (let i = 0; i < 5; i++) {
  const b = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1),
    new THREE.MeshStandardMaterial({ color: 0x996655, roughness: 0.8 }));
  b.position.set(-4 + i * 2, -1.65, 2 + (i % 2));
  ctx.engine.scene.add(b);
}

const out = { phase: 'init' };
try {
  await postfx.init(ctx);
  out.provided = !!ctx.postfx;
  out.api = ctx.postfx ? Object.keys(ctx.postfx).sort() : null;
  out.brokenAfterSelfTest = ctx.postfx ? JSON.parse(JSON.stringify(ctx.postfx.stats.broken)) : null;

  ctx.debug.enabled = true;
  ctx.postfx.setEnabled('profile', true);

  const copyTex = ctx.postfx.requestSceneCopy();
  out.sceneCopy = !!(copyTex && copyTex.isTexture);

  out.phase = 'frames';
  for (let i = 0; i < 12; i++) {
    ctx.time.frames = i; ctx.time.dt = 1 / 60; ctx.time.elapsed += 1 / 60;
    // Move a câmera para o motion blur entrar em cena.
    ctx.engine.camera.position.x = Math.sin(i * 0.25) * 2.0;
    ctx.engine.camera.rotation.y = Math.sin(i * 0.11) * 0.15;
    ctx.engine.camera.updateMatrixWorld(true);
    mesh.rotation.y += 0.02;
    ctx.postfx.render(ctx);
  }

  out.phase = 'rebase';
  ctx.events.emit('frame:rebase', { shift: { x: 1200, y: -80, z: 640 }, origin: { x: 0, y: 0, z: 0 } });
  ctx.postfx.render(ctx);
  ctx.events.emit('frame:rebase', { shift: { x: 4e8, y: 0, z: 0 }, origin: { x: 0, y: 0, z: 0 } });
  ctx.postfx.render(ctx);

  out.phase = 'resize';
  for (const [w, h] of [[400, 300], [900, 620], [640, 400]]) {
    ctx.engine.resize(w, h);
    ctx.postfx.render(ctx);
    ctx.postfx.render(ctx);
  }
  ctx.engine.setRenderScale(0.6);
  ctx.postfx.render(ctx);
  ctx.engine.setRenderScale(1.0);
  ctx.postfx.render(ctx);

  out.phase = 'toggles';
  for (const n of ['ssao', 'godrays', 'bloom', 'motionBlur', 'chromatic', 'vignette', 'grain', 'aa']) {
    out['setEnabled:' + n] = ctx.postfx.setEnabled(n, false);
  }
  ctx.postfx.render(ctx);
  for (const n of ['ssao', 'godrays', 'bloom', 'motionBlur', 'chromatic', 'vignette', 'grain', 'aa']) ctx.postfx.setEnabled(n, true);
  out.setParamOk = ctx.postfx.setParam('bloom', 'threshold', 0.8) && ctx.postfx.setParam('exposure', 1.3);
  out.setParamBad = ctx.postfx.setParam('bloom', 'naoExiste', 1);
  ctx.postfx.setParam('ssao', 'dirs', 6); ctx.postfx.setParam('ssao', 'steps', 6);
  ctx.postfx.setParam('godrays', 'samples', 48);
  ctx.postfx.setParam('motionBlur', 'taps', 13);
  for (let i = 0; i < 90; i++) { ctx.time.frames += 1; ctx.engine.camera.position.x = Math.sin(i * 0.2) * 1.5; ctx.engine.camera.updateMatrixWorld(true); ctx.postfx.render(ctx); }

  out.phase = 'read';
  // A tela não pode estar preta.
  const gl = ctx.engine.renderer.getContext();
  const px = new Uint8Array(gl.drawingBufferWidth * gl.drawingBufferHeight * 4);
  gl.readPixels(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let sum = 0, nonZero = 0;
  for (let i = 0; i < px.length; i += 4) { const v = px[i] + px[i + 1] + px[i + 2]; sum += v; if (v > 6) nonZero++; }
  out.pixelsNonZero = nonZero;
  out.pixelsTotal = px.length / 4;
  out.avg = (sum / (px.length / 4) / 3).toFixed(2);

  out.aoTexture = !!ctx.postfx.aoTexture;
  out.timings = ctx.postfx.timings ? Array.from(ctx.postfx.timings.keys()) : null;
  out.debugLines = Array.from(ctx.debug.lines.entries()).filter(([k]) => k.startsWith('postfx'));
  out.stats = { ms: +ctx.postfx.stats.ms.toFixed(3), degraded: ctx.postfx.stats.degraded, broken: ctx.postfx.stats.broken };

  out.phase = 'dispose';
  const before = ctx.engine.renderer.info.memory.textures;
  postfx.dispose(ctx);
  out.texturesBeforeDispose = before;
  out.texturesAfterDispose = ctx.engine.renderer.info.memory.textures;
  out.phase = 'done';
} catch (e) {
  out.fatal = String(e && e.stack || e);
}
out.errors = errors;
window.__SMOKE__ = out;
</script>
